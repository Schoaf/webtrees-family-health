# A tag v<version> builds the ZIP for webtrees and publishes it as a GitHub release.
# The ZIP holds the folder family-health/ - webtrees takes the module's route (_family-health_) from that name.
name: Release

on:
  push:
    tags: ["v*"]

jobs:
  tests:
    uses: ./.github/workflows/tests.yml

  release:
    needs: tests
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Check version
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          grep -q "return '$VERSION';" FamilyHealthModule.php || { echo "::error::customModuleVersion() is not $VERSION"; exit 1; }
          [ "$(tr -d '[:space:]' < latest-version.txt)" = "$VERSION" ] || { echo "::error::latest-version.txt is not $VERSION"; exit 1; }
          grep -q "^## $VERSION\$" CHANGELOG.md || { echo "::error::CHANGELOG.md has no section $VERSION"; exit 1; }
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"

      - name: Build ZIP
        run: |
          mkdir -p build/family-health
          cp -r module.php FamilyHealthModule.php src resources LICENSE README.md README.de.md CHANGELOG.md latest-version.txt build/family-health/
          (cd build && zip -qr "../family-health-$VERSION.zip" family-health)
          unzip -l "family-health-$VERSION.zip"

      - name: Release notes from CHANGELOG
        run: awk -v v="## $VERSION" '$0 == v {on=1; next} /^## / {on=0} on' CHANGELOG.md > notes.md

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" "family-health-$VERSION.zip" --title "$VERSION" --notes-file notes.md
